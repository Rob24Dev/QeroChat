plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cz.rob24dev.chatapp'
version = '0.9.6-BETA'
description = 'ChatAppServer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-mail:4.1.2'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.11'
    implementation 'com.auth0:java-jwt:4.6.2'
    implementation("io.minio:minio:9.0.4")
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.22.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("jakarta.xml.bind:jakarta.xml.bind-api:4.1.0-M1")
    implementation("org.glassfish.jaxb:jaxb-runtime:4.0.9")
    implementation("com.sun.mail:jakarta.mail:2.0.2")
}

tasks.named('test') {
    useJUnitPlatform()
}
