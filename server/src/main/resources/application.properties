spring.application.name=ChatAppServer
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/chatapp
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
jwt.secret.key=${JWT_SECRET}
spring.servlet.multipart.max-file-size=5MB

spring.mail.host=${MAIL_HOST}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.springframework.security=WARN

application.frontend=${FRONTEND_URL}
minio.access.key=${MINIO_ACCESS}
minio.secret.key=${MINIO_SECRET}
minio.endpoint=${MINIO_ENDPOINT}